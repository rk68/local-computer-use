<svg xmlns="http://www.w3.org/2000/svg" width="650" height="650" viewBox="0 0 650 650"><rect width="650" height="650" rx="24" fill="#111"/><g fill="#eee" transform="translate(116 44) scale(2.8)"><path d="M8 5h10v14a12 12 0 0 1 21 9v15H29V29a5.5 5.5 0 0 0-11 0v14H8Z"/><path d="M18 14 8 24v7l10-10Z" fill="#111"/></g><text x="36" y="228" fill="#eee" font-family="system-ui,sans-serif" font-size="21">01A / Open arch</text><text x="36" y="256" fill="#999" font-family="system-ui,sans-serif" font-size="12">A calmer, continuous h. No detached dot.</text><g fill="#eee" transform="translate(436 44) scale(2.8)"><path d="M8 5h9v14c3-3 6-4 9-4 8 0 13 6 13 14v14h-9V29c0-4-2-6-6-6s-7 2-7 6v14H8Z"/><path d="m21 14 8 9h5l-8-9Z" fill="#111"/></g><text x="356" y="228" fill="#eee" font-family="system-ui,sans-serif" font-size="21">01B / Ribbon h</text><text x="356" y="256" fill="#999" font-family="system-ui,sans-serif" font-size="12">Soft terminals, a cut across the shoulder.</text><g fill="#eee" transform="translate(116 359) scale(2.8)"><path d="M7 5h9v16h15V5h9v29H16v9H7Z"/><path d="M20 38h20v5H20Z"/></g><text x="36" y="543" fill="#eee" font-family="system-ui,sans-serif" font-size="21">02A / Folded hl</text><text x="36" y="571" fill="#999" font-family="system-ui,sans-serif" font-size="12">The L folds beneath the H as one mark.</text><g fill="#eee" transform="translate(436 359) scale(2.8)"><path d="M7 5h9v15h13V5h9v29h5v9H29V29H16v14H7Z"/></g><text x="356" y="543" fill="#eee" font-family="system-ui,sans-serif" font-size="21">02B / Joined hl</text><text x="356" y="571" fill="#999" font-family="system-ui,sans-serif" font-size="12">An open counter and a longer baseline.</text></svg>